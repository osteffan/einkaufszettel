<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2e7d32">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
  <title>Einkaufszettel</title>
</head>
<body>
  <header>
    <h1>🛒 Einkaufszettel</h1>
    <button id="clear" type="button">Erledigte löschen</button>
  </header>
  <main>
    <form id="form" autocomplete="off">
      <input id="input" type="text" placeholder="Artikel hinzufügen…" required>
      <button type="submit">+</button>
    </form>
    <ul id="list"></ul>
    <p id="empty" hidden>Die Liste ist leer.</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
